[project]
name = "multimodal-knowledge-engine-backend"
version = "0.1.0"
description = "FastAPI backend for the Multimodal Knowledge Engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.8,<3",
  "PyMuPDF>=1.25,<2",
  "sentence-transformers>=3.4,<6",
  "qdrant-client>=1.14,<2",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
